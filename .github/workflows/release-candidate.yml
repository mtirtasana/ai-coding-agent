name: Internal release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r vscode/backend/runtime-cli.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - run: npm ci && npm test && npm run package
        working-directory: vscode
      - run: python tools/release_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: internal-release-candidate
          path: release/artifacts/*
