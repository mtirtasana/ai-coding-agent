[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-agent-starter"
version = "0.4.0"
description = "Ein kleiner KI-Coding-Agent mit dateibasierten Werkzeugen"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.66,<3"]
terminal = ["prompt-toolkit>=3.0,<4"]

[project.scripts]
coding-agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]
