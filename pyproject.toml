[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-agent-starter"
version = "0.12.0"
description = "Ein kleiner KI-Coding-Agent mit dateibasierten Werkzeugen"
requires-python = ">=3.11,<3.15"
dependencies = ["pathspec>=0.12,<1"]

[project.optional-dependencies]
openai = ["openai>=1.66,<3"]
terminal = ["prompt-toolkit>=3.0,<4"]
connections = ["keyring>=25,<26"]
tokens = ["tiktoken>=0.9,<1"]
dev = ["ruff>=0.9,<1"]
security = ["bandit[toml]>=1.8,<2", "pip-audit>=2.9,<3"]

[project.scripts]
coding-agent = "agent.cli:main"
coding-agent-eval = "agent.evaluate:main"
coding-agent-server = "agent.server:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
